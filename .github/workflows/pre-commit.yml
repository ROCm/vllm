name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: "3.12"
    # Provide shellcheck on PATH so tools/pre_commit/shellcheck.sh skips its
    # wget + tar -xJ self-download, which the self-hosted runner image lacks
    # (no wget/xz). Pinned to shellcheck 0.10.0 to match the script's "stable".
    - run: python -m pip install shellcheck-py==0.10.0.1
    - run: echo "::add-matcher::.github/workflows/matchers/actionlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"
    - run: echo "::add-matcher::.github/workflows/matchers/mypy.json"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: --all-files --hook-stage manual
      env:
        # update-dockerfile-graph only regenerates
        # docs/assets/contributing/dockerfile-stages-dependency.png, an upstream
        # docs asset this fork does not use. It also needs a Docker daemon and
        # exits 0 silently on runners without one, so it never reliably guarded
        # that asset -- it just failed on whichever runner happened to have
        # Docker. Skipped here rather than dropping the hook from
        # .pre-commit-config.yaml, which upstream edits often.
        SKIP: update-dockerfile-graph
