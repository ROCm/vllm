name: Build Flash Attn ROCm Wheels

# This workflow builds flash_attn wheels with the Triton backend for ROCm and
# uploads them to s3://aig-embd-gfx11-wheels/simple/flash-attn/ (PEP 503 index).
#
# IMPORTANT: Architecture Independence
# ------------------------------------
# When FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE is set, the flash_attn package
# uses the Triton backend instead of the Composable Kernel (CK) backend.
# This means:
#   1. No native HIP/C++ code is compiled into the wheel (SKIP_CK_BUILD=TRUE)
#   2. The Triton kernels are compiled JIT (just-in-time) at runtime
#   3. The resulting wheel is architecture-agnostic
#
# Versioning: the workflow tracks a pinned commit of
# Dao-AILab/flash-attention (before the aiter migration that introduced a
# hard triton==3.5.1 pin and removed the bundled AMD Triton backend).
# The wheel version is derived from `git describe` against the latest v2.*
# tag, e.g.
#   on a tag       → 2.8.3
#   N commits past → 2.8.4.dev<N>+g<shortsha>
#
# The check job skips the build when a wheel matching the pinned SHA
# is already present in the S3 index.

on:
  push:
    branches:
      - gfx11
  pull_request:
    branches:
      - gfx11

env:
  PYTORCH_INDEX_URL: 'https://rocm.nightlies.amd.com/v2-staging/gfx1151'
  FLASH_ATTN_REPO: 'Dao-AILab/flash-attention'
  FLASH_ATTN_REF: 'bbe25bacff9f337568b66e69950e549df9839068'
  S3_BUCKET: aig-embd-gfx11-wheels
  S3_ROLE_ARN: arn:aws:iam::317668459450:role/therock-aig-embd-gfx11-wheels-s3-oidc
  AWS_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve flash-attention ref
        id: resolve
        env:
          REF: ${{ env.FLASH_ATTN_REF }}
        run: |
          set -euo pipefail
          SHA=${REF:0:8}
          echo "Pinned ref = ${SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # `git describe` puts the SHA after `g` in the version string, so
          # the wheel filename contains `+g${SHA}-` (or, on a tag, no SHA at
          # all -- but then upstream has cut a release and we just want the
          # next release-tracking workflow to fire).
          MATCH=$(aws s3api list-objects-v2 \
                    --bucket "$S3_BUCKET" \
                    --prefix "simple/flash-attn/flash_attn-" \
                    --query "Contents[?contains(Key, '+g${SHA}-')].Key" \
                    --output text)
          if [ -n "$MATCH" ] && [ "$MATCH" != "None" ]; then
            echo "Already in S3: $MATCH"
            SHOULD=false
          else
            echo "No wheel matching +g${SHA}- in S3; building"
            SHOULD=true
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"

  build-wheel:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone flash-attention repository
        env:
          REPO: ${{ env.FLASH_ATTN_REPO }}
          REF: ${{ env.FLASH_ATTN_REF }}
        run: |
          # Need full history (or at least back to the latest v2.* tag) so
          # `git describe` can compute commit count + short SHA.
          git clone "https://github.com/${REPO}" flash-attention
          cd flash-attention
          git checkout "$REF"
          echo "Flash Attention at: $(git rev-parse HEAD)"
          git describe --tags --long --match 'v2.*'

      - name: Compute wheel version from git describe
        working-directory: flash-attention
        run: |
          set -euo pipefail
          RAW=$(git describe --tags --long --match 'v2.*' --abbrev=8)
          echo "git describe: $RAW"
          # RAW looks like:  v2.8.3-42-gabc12345
          TAG=${RAW#v}; TAG=${TAG%-*-*}                        # 2.8.3
          COUNT=$(echo "$RAW" | awk -F- '{print $(NF-1)}')     # 42
          SHA=$(echo "$RAW" | awk -F- '{print $NF}')           # gabc12345
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$TAG"
          else
            NEXT=$(echo "$TAG" | awk -F. -v OFS=. '{ $NF=$NF+1; print }')
            VERSION="${NEXT}.dev${COUNT}+${SHA}"
          fi
          echo "Computed VERSION=$VERSION"
          # Upstream's setup.py reads __version__ from flash_attn/__init__.py;
          # rewrite it so bdist_wheel produces the right filename.
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" flash_attn/__init__.py
          grep '^__version__' flash_attn/__init__.py

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-flash-attn-${{ runner.os }}-py312
          restore-keys: |
            pip-flash-attn-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools ninja packaging psutil

      - name: Install PyTorch from ROCm nightly
        run: |
          pip install torch --index-url ${{ env.PYTORCH_INDEX_URL }}
          pip list | grep -i -E "torch" || true
          python -c "import torch; print(f'PyTorch version: {torch.__version__}'); print(f'HIP: {torch.version.hip}')"

      - name: Install flash_attn dependencies
        run: |
          pip install einops

      - name: Build wheel
        env:
          FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
        working-directory: flash-attention
        run: |
          echo "=== Building wheel ==="
          python setup.py bdist_wheel --dist-dir=dist
          ls -la dist/

      - name: Rename wheel for manylinux compliance
        working-directory: flash-attention
        run: |
          cd dist
          for wheel in *.whl; do
            if [[ "$wheel" == *"linux"* ]]; then
              new_name="${wheel/linux/manylinux_2_31}"
              mv "$wheel" "$new_name"
              echo "Renamed $wheel to $new_name"
            fi
          done
          ls -la

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-rocm-wheel
          path: flash-attention/dist/*.whl
          retention-days: 90

  upload-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ROCm'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/scripts
          fetch-depth: 1

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: flash-attn-rocm-wheel
          path: dist/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload wheel to S3
        run: |
          pip install boto3
          python .github/workflows/scripts/upload_wheel_s3.py \
            --bucket "$S3_BUCKET" \
            --package flash-attn \
            --wheel-dir dist/
