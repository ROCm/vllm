name: Build Flash Attn and AITER ROCm Wheels

# This workflow builds two wheels and (optionally) uploads them to
# s3://aig-embd-gfx11-wheels/ (PEP 503 index):
#
#   * flash_attn       (Triton backend) -> simple/flash-attn/
#   * amd-aiter        (kernels off)    -> simple/amd-aiter/
#
# IMPORTANT: Architecture Independence
# ------------------------------------
# When FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE is set, the flash_attn package
# uses the Triton backend instead of the Composable Kernel (CK) backend.
# This means:
#   1. No native HIP/C++ code is compiled into the wheel (SKIP_CK_BUILD=TRUE)
#   2. The Triton kernels are compiled JIT (just-in-time) at runtime
#   3. The resulting wheel is architecture-agnostic
#
# AITER is currently built with PREBUILD_KERNELS=0, which short-circuits all
# HIP compilation in aiter/setup.py. GPU_ARCHS is still set so flipping to
# PREBUILD_KERNELS=1 (kernels baked in for gfx1151) is a one-line change --
# at that point the AITER build job will additionally need ROCm available
# on the runner (e.g. via a `rocm/dev-ubuntu-22.04` container).
#
# Versioning: each wheel version is derived from `git describe` of the
# upstream repo, e.g.
#   on a tag       -> 2.8.3
#   N commits past -> 2.8.4.dev<N>+g<shortsha>
#
# Each check job skips the build when a wheel matching the pinned SHA
# is already present in the S3 index.

on:
  push:
    branches:
      - gfx11
  pull_request:
    branches:
      - gfx11

env:
  PYTORCH_INDEX_URL: 'https://rocm.nightlies.amd.com/v2-staging/gfx1151'
  FLASH_ATTN_REPO: 'Dao-AILab/flash-attention'
  FLASH_ATTN_REF: 'bbe25bacff9f337568b66e69950e549df9839068'
  AITER_REPO: 'ROCm/aiter'
  # Branch (or tag/SHA) of AITER to build. The check-aiter job resolves
  # this to a SHA via `git ls-remote`.
  AITER_REF: 'matthias.gfx11'
  # Unused while AITER_PREBUILD_KERNELS=0; kept so flipping to 1 needs
  # no other changes.
  AITER_GPU_ARCHS: 'gfx1151'
  AITER_PREBUILD_KERNELS: '0'
  S3_BUCKET: aig-embd-gfx11-wheels
  S3_ROLE_ARN: arn:aws:iam::317668459450:role/therock-aig-embd-gfx11-wheels-s3-oidc
  AWS_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve flash-attention ref
        id: resolve
        env:
          REF: ${{ env.FLASH_ATTN_REF }}
        run: |
          set -euo pipefail
          SHA=${REF:0:8}
          echo "Pinned ref = ${SHA}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # `git describe` puts the SHA after `g` in the version string, so
          # the wheel filename contains `+g${SHA}-` (or, on a tag, no SHA at
          # all -- but then upstream has cut a release and we just want the
          # next release-tracking workflow to fire).
          MATCH=$(aws s3api list-objects-v2 \
                    --bucket "$S3_BUCKET" \
                    --prefix "simple/flash-attn/flash_attn-" \
                    --query "Contents[?contains(Key, '+g${SHA}-')].Key" \
                    --output text)
          if [ -n "$MATCH" ] && [ "$MATCH" != "None" ]; then
            echo "Already in S3: $MATCH"
            SHOULD=false
          else
            echo "No wheel matching +g${SHA}- in S3; building"
            SHOULD=true
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"

  build-wheel:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone flash-attention repository
        env:
          REPO: ${{ env.FLASH_ATTN_REPO }}
          REF: ${{ env.FLASH_ATTN_REF }}
        run: |
          # Need full history (or at least back to the latest v2.* tag) so
          # `git describe` can compute commit count + short SHA.
          git clone "https://github.com/${REPO}" flash-attention
          cd flash-attention
          git checkout "$REF"
          echo "Flash Attention at: $(git rev-parse HEAD)"
          git describe --tags --long --match 'v2.*'

      - name: Compute wheel version from git describe
        working-directory: flash-attention
        run: |
          set -euo pipefail
          RAW=$(git describe --tags --long --match 'v2.*' --abbrev=8)
          echo "git describe: $RAW"
          # RAW looks like:  v2.8.3-42-gabc12345
          TAG=${RAW#v}; TAG=${TAG%-*-*}                        # 2.8.3
          COUNT=$(echo "$RAW" | awk -F- '{print $(NF-1)}')     # 42
          SHA=$(echo "$RAW" | awk -F- '{print $NF}')           # gabc12345
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$TAG"
          else
            NEXT=$(echo "$TAG" | awk -F. -v OFS=. '{ $NF=$NF+1; print }')
            VERSION="${NEXT}.dev${COUNT}+${SHA}"
          fi
          echo "Computed VERSION=$VERSION"
          # Upstream's setup.py reads __version__ from flash_attn/__init__.py;
          # rewrite it so bdist_wheel produces the right filename.
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" flash_attn/__init__.py
          grep '^__version__' flash_attn/__init__.py

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-flash-attn-${{ runner.os }}-py312
          restore-keys: |
            pip-flash-attn-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools ninja packaging psutil

      - name: Install PyTorch from ROCm nightly
        run: |
          pip install torch --index-url ${{ env.PYTORCH_INDEX_URL }}
          pip list | grep -i -E "torch" || true
          python -c "import torch; print(f'PyTorch version: {torch.__version__}'); print(f'HIP: {torch.version.hip}')"

      - name: Install flash_attn dependencies
        run: |
          pip install einops

      - name: Build wheel
        env:
          FLASH_ATTENTION_TRITON_AMD_ENABLE: "TRUE"
        working-directory: flash-attention
        run: |
          echo "=== Building wheel ==="
          python setup.py bdist_wheel --dist-dir=dist
          ls -la dist/

      - name: Rename wheel for manylinux compliance
        working-directory: flash-attention
        run: |
          cd dist
          for wheel in *.whl; do
            if [[ "$wheel" == *"linux"* ]]; then
              new_name="${wheel/linux/manylinux_2_31}"
              mv "$wheel" "$new_name"
              echo "Renamed $wheel to $new_name"
            fi
          done
          ls -la

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-rocm-wheel
          path: flash-attention/dist/*.whl
          retention-days: 90

  upload-wheel:
    needs: build-wheel
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ROCm'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/scripts
          fetch-depth: 1

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: flash-attn-rocm-wheel
          path: dist/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload wheel to S3
        run: |
          pip install boto3
          python .github/workflows/scripts/upload_wheel_s3.py \
            --bucket "$S3_BUCKET" \
            --package flash-attn \
            --wheel-dir dist/

  check-aiter:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      full_sha: ${{ steps.resolve.outputs.full_sha }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Resolve AITER ref to commit SHA
        id: resolve
        env:
          REPO: ${{ env.AITER_REPO }}
          REF: ${{ env.AITER_REF }}
        run: |
          set -euo pipefail
          # AITER_REF may be a branch, tag, or SHA. `git ls-remote` works
          # for branches/tags; for a raw SHA we just truncate.
          if FULL=$(git ls-remote "https://github.com/${REPO}" "${REF}" \
                      | awk 'NR==1 {print $1}') && [ -n "$FULL" ]; then
            echo "Resolved ${REF} -> ${FULL}"
          else
            FULL=$REF
            echo "Treating ${REF} as raw SHA"
          fi
          SHA=${FULL:0:8}
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Decide whether to build
        id: decide
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Wheel filename contains `+g${SHA}-` (see version derivation in
          # build-aiter-wheel). Package name `amd-aiter` becomes
          # `amd_aiter-` in the filename.
          MATCH=$(aws s3api list-objects-v2 \
                    --bucket "$S3_BUCKET" \
                    --prefix "simple/amd-aiter/amd_aiter-" \
                    --query "Contents[?contains(Key, '+g${SHA}-')].Key" \
                    --output text)
          if [ -n "$MATCH" ] && [ "$MATCH" != "None" ]; then
            echo "Already in S3: $MATCH"
            SHOULD=false
          else
            echo "No wheel matching +g${SHA}- in S3; building"
            SHOULD=true
          fi
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"

  build-aiter-wheel:
    needs: check-aiter
    if: needs.check-aiter.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone AITER repository
        env:
          REPO: ${{ env.AITER_REPO }}
          FULL_SHA: ${{ needs.check-aiter.outputs.full_sha }}
        run: |
          set -euo pipefail
          # Recursive submodules pull in composable_kernel; only required
          # once we enable PREBUILD_KERNELS=1, but cheap enough to do now
          # so the build environment matches the future kernels-on path.
          git clone --recursive "https://github.com/${REPO}" aiter
          cd aiter
          git checkout "$FULL_SHA"
          git submodule update --init --recursive
          echo "AITER at: $(git rev-parse HEAD)"
          git describe --tags --long --match 'v*' || true

      - name: Compute wheel version from git describe
        working-directory: aiter
        run: |
          set -euo pipefail
          RAW=$(git describe --tags --long --match 'v*' --abbrev=8)
          echo "git describe: $RAW"
          # RAW looks like:  v0.1.14-rc0-8-gc387fb45  (or v2.8.3-42-gabc12345)
          TAG=${RAW#v}; TAG=${TAG%-*-*}                        # 0.1.14-rc0
          COUNT=$(echo "$RAW" | awk -F- '{print $(NF-1)}')     # 8
          SHA=$(echo "$RAW" | awk -F- '{print $NF}')           # gc387fb45
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$TAG"
          else
            # awk numeric-coerces the last dotted field, so e.g. `14-rc0`
            # becomes 15 (rc suffix dropped). Good enough for a dev build.
            NEXT=$(echo "$TAG" | awk -F. -v OFS=. '{ $NF=$NF+1; print }')
            VERSION="${NEXT}.dev${COUNT}+${SHA}"
          fi
          echo "Computed VERSION=$VERSION"
          # AITER's setup.py uses `use_scm_version=True`; the pretend-version
          # env var overrides setuptools_scm so the wheel filename is
          # predictable and matches the check-aiter S3 lookup.
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-aiter-${{ runner.os }}-py312
          restore-keys: |
            pip-aiter-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools setuptools_scm ninja packaging psutil pyyaml

      - name: Install PyTorch from ROCm nightly
        run: |
          pip install torch --index-url ${{ env.PYTORCH_INDEX_URL }}
          pip list | grep -i -E "torch" || true
          python -c "import torch; print(f'PyTorch version: {torch.__version__}'); print(f'HIP: {torch.version.hip}')"

      - name: Install AITER runtime dependencies
        working-directory: aiter
        run: |
          pip install -r requirements.txt

      - name: Build wheel
        env:
          PREBUILD_KERNELS: ${{ env.AITER_PREBUILD_KERNELS }}
          GPU_ARCHS: ${{ env.AITER_GPU_ARCHS }}
        working-directory: aiter
        run: |
          echo "=== Building wheel (PREBUILD_KERNELS=$PREBUILD_KERNELS, GPU_ARCHS=$GPU_ARCHS) ==="
          python setup.py bdist_wheel --dist-dir=dist
          ls -la dist/

      - name: Rename wheel for manylinux compliance
        working-directory: aiter
        run: |
          cd dist
          for wheel in *.whl; do
            if [[ "$wheel" == *"linux"* ]] && [[ "$wheel" != *"manylinux"* ]]; then
              new_name="${wheel/linux/manylinux_2_31}"
              mv "$wheel" "$new_name"
              echo "Renamed $wheel to $new_name"
            fi
          done
          ls -la

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiter-rocm-wheel
          path: aiter/dist/*.whl
          retention-days: 90

  upload-aiter-wheel:
    needs: build-aiter-wheel
    runs-on: ubuntu-latest
    # Upload is intentionally disabled while the AITER build job is being
    # validated. To enable, replace `if: false` with the same guard the
    # flash-attn upload uses:
    #   if: github.repository_owner == 'ROCm'
    if: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows/scripts
          fetch-depth: 1

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: aiter-rocm-wheel
          path: dist/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ env.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload wheel to S3
        run: |
          pip install boto3
          python .github/workflows/scripts/upload_wheel_s3.py \
            --bucket "$S3_BUCKET" \
            --package amd-aiter \
            --wheel-dir dist/
